packageExtensions:
  '@sabinmarcu/theme@1.2.4':
    dependencies:
      ts-deepmerge: '^8.0.0'
    peerDependenciesMeta:
      '@mui/icons-material':
        optional: true
      '@mui/material':
        optional: true
      '@storybook/react':
        optional: true
